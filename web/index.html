<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sable — play</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
<style>
  :root {
    --bg: #131110;        /* sable — near-black, warm */
    --panel: #1c1917;
    --line: #2c2724;
    --ink: #e8e0d2;       /* primary text */
    --bone: #e8e0d2;      /* light squares */
    --walnut: #8a6c52;    /* dark squares */
    --amber: #e0a458;     /* single accent */
    --dim: #9b8f83;
    --barbg: #3a3430;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  /* The board keeps its bone-and-walnut colouring in both themes -- those are
     the piece squares, not chrome, and inverting them makes the pieces wrong.
     Only the surface around it changes. */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f1ea; --panel: #fffdf8; --line: #ddd5c7;
      --ink: #2a2420; --dim: #6f6459; --amber: #a86a1c; --barbg: #cfc6b6;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f1ea; --panel: #fffdf8; --line: #ddd5c7;
    --ink: #2a2420; --dim: #6f6459; --amber: #a86a1c; --barbg: #cfc6b6;
  }
  :root[data-theme="dark"] {
    --bg: #131110; --panel: #1c1917; --line: #2c2724;
    --ink: #e8e0d2; --dim: #9b8f83; --amber: #e0a458; --barbg: #3a3430;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--mono); font-size: 14px;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .app { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .side { width: 300px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .16em; }
  h1 .v { color: var(--amber); }
  .sub { color: var(--dim); font-size: 12px; line-height: 1.5; margin-top: 6px; }
  #board { width: min(560px, 92vw); box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0,0,0,.5); }
  /* board recolor: bone + walnut over chessboard.js defaults */
  .white-1e1d7 { background: var(--bone) !important; color: var(--walnut) !important; }
  .black-3c85d { background: var(--walnut) !important; color: var(--bone) !important; }
  .board-b72b1 { border: none !important; }
  .sq-last { box-shadow: inset 0 0 0 3px var(--amber) !important; }
  .boardwrap { display: flex; gap: 10px; align-items: stretch; }
  #evalbar {
    width: 14px; background: var(--barbg); border: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #evalbar .w {
    background: var(--bone); width: 100%; height: 50%; margin-top: auto;
    transition: height .6s cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-reduced-motion: reduce) { #evalbar .w { transition: none; } }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; }
  .label { color: var(--dim); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; margin-bottom: 8px; }
  #status { font-size: 13px; min-height: 20px; }
  #status.think { color: var(--amber); }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat b { display: block; font-size: 18px; font-weight: 600; color: var(--amber); }
  .stat span { color: var(--dim); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
  #tel { height: 150px; overflow-y: auto; font-size: 11px; line-height: 1.7; color: var(--dim); white-space: pre-wrap; word-break: break-all; }
  #tel .pv { color: var(--ink); }
  #moves { font-size: 12px; line-height: 1.8; color: var(--dim); max-height: 90px; overflow-y: auto; }
  #moves b { color: var(--ink); font-weight: 500; }
  .row { display: flex; gap: 10px; align-items: center; }
  button, select {
    background: none; border: 1px solid var(--line); color: var(--ink);
    font: inherit; font-size: 12px; padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--amber); color: var(--amber); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  select { background: var(--panel); }
  a { color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }
  a:hover { color: var(--amber); }
</style>

<div class="app">
  <div class="boardwrap">
    <div id="evalbar" aria-hidden="true"><div class="w"></div></div>
    <div id="board"></div>
  </div>
  <div class="side">
    <div>
      <h1>SABLE <span class="v">1.0</span></h1>
      <div class="sub">no_std &middot; no libc &middot; raw syscalls &middot; 291&thinsp;KB binary<br>
        60&thinsp;KB neural evaluation &middot; about 2800 Elo<br>drag to move</div>
    </div>
    <div class="panel">
      <div class="label">status</div>
      <div id="status">your move</div>
    </div>
    <div class="panel stats">
      <div class="stat"><b id="s-depth">–</b><span>depth</span></div>
      <div class="stat"><b id="s-eval">–</b><span>eval</span></div>
      <div class="stat"><b id="s-nps">–</b><span>knps</span></div>
    </div>
    <div class="panel">
      <div class="label">sable expects</div>
      <div id="pv" style="font-size:12px; line-height:1.7; color:var(--dim); min-height:20px;">–</div>
    </div>
    <div class="panel">
      <div class="label">search telemetry</div>
      <div id="tel"></div>
    </div>
    <div class="panel">
      <div class="label">moves</div>
      <div id="moves">&nbsp;</div>
    </div>
    <div class="row">
      <button id="new">New game</button>
      <button id="flip">Play black</button>
      <button id="undo" title="take back your last move">Undo</button>
      <button id="pgn" title="copy game PGN">PGN</button>
      <button id="theme" title="switch between light and dark">Theme</button>
      <select id="mt" aria-label="engine think time">
        <option value="250">250 ms</option>
        <option value="1000" selected>1 s</option>
        <option value="3000">3 s</option>
        <option value="10000">10 s</option>
      </select>
    </div>
    <div class="sub" style="margin-top:2px">
      <a href="/daily">lab daily</a> &middot;
      <a href="/api/status">status</a> &middot;
      <a href="https://github.com/shubhxho/based-chess-rs">source</a> &middot;
      <a href="https://huggingface.co/shubhxho/sable-chess-net">network on the Hub</a>
      <span id="gate-hint"></span>
      <span id="lab-hint"></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
<script>
const game = new Chess();
let thinking = false;
let myColor = 'w';

const board = Chessboard('board', {
  position: 'start',
  draggable: true,
  pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
  onDragStart: (src, piece) =>
    !thinking && !game.game_over() && game.turn() === myColor && piece[0] === myColor,
  onDrop: (src, dst) => {
    const mv = game.move({ from: src, to: dst, promotion: 'q' });
    if (!mv) return 'snapback';
    afterMove();
    engineMove();
  },
  onSnapEnd: () => board.position(game.fen()),
});

const $id = id => document.getElementById(id);
const uciMoves = () =>
  game.history({ verbose: true }).map(m => m.from + m.to + (m.promotion || ''));

function markLast() {
  document.querySelectorAll('.sq-last').forEach(e => e.classList.remove('sq-last'));
  const h = game.history({ verbose: true });
  const m = h[h.length - 1];
  if (m) [m.from, m.to].forEach(sq => {
    const el = document.querySelector(`#board .square-${sq}`);
    if (el) el.classList.add('sq-last');
  });
}

function setEvalBar(cpWhite) {
  // logistic squash: +-800cp ~ full bar
  const p = 1 / (1 + Math.pow(10, -cpWhite / 400));
  document.querySelector('#evalbar .w').style.height = (p * 100).toFixed(1) + '%';
}

function afterMove() {
  markLast();
  const h = game.history();
  $id('moves').innerHTML = h.map((m, i) =>
    i % 2 ? ` <b>${m}</b> ` : `${Math.floor(i / 2) + 1}. ${m}`).join('') || '&nbsp;';
  const el = $id('moves'); el.scrollTop = el.scrollHeight;
  if (game.game_over()) {
    $id('status').className = '';
    $id('status').textContent =
      game.in_checkmate() ? (game.turn() === myColor ? 'checkmate — sable wins' : 'checkmate — you win')
      : game.in_stalemate() ? 'stalemate'
      : game.in_threefold_repetition() ? 'draw — repetition'
      : 'draw';
    return true;
  }
  return false;
}

// UCI pv -> readable SAN, played out on a scratch copy of the game
function pvToSan(pvStr) {
  const scratch = new Chess(game.fen());
  const out = [];
  for (const u of (pvStr || '').split(' ')) {
    const m = scratch.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] });
    if (!m) break;
    out.push(m.san);
    if (out.length >= 10) break;
  }
  return out.join(' ');
}

function showInfo(lines) {
  const tel = $id('tel');
  tel.innerHTML = lines.slice(-14).map(l =>
    `<div>${l.replace(/ pv (.*)$/, ' pv <span class="pv">$1</span>')}</div>`).join('');
  tel.scrollTop = tel.scrollHeight;
  const last = lines[lines.length - 1] || '';
  const g = (re) => (last.match(re) || [])[1];
  const d = g(/ depth (\d+)/), n = g(/ nps (\d+)/);
  const cp = g(/ score cp (-?\d+)/), mate = g(/ score mate (-?\d+)/);
  if (d) $id('s-depth').textContent = d;
  if (n) $id('s-nps').textContent = Math.round(+n / 1000);
  if (mate) $id('s-eval').textContent = '#' + mate;
  else if (cp) $id('s-eval').textContent = (cp >= 0 ? '+' : '') + (cp / 100).toFixed(2);
  // info scores are from the side-to-move (engine) perspective; bar is white-up
  const engineIsWhite = myColor === 'b';
  if (mate) setEvalBar((engineIsWhite ? +mate : -mate) > 0 ? 10000 : -10000);
  else if (cp) setEvalBar(engineIsWhite ? +cp : -cp);
}

async function engineMove() {
  if (game.game_over()) return;
  thinking = true;
  const st = $id('status');
  st.className = 'think'; st.textContent = 'sable thinking…';
  try {
    const r = await fetch('/api/move', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ moves: uciMoves(), movetime: +$id('mt').value }),
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    showInfo(j.info || []);
    const lastPv = ((j.info || []).slice(-1)[0] || '').match(/ pv (.*)$/);
    if (lastPv) $id('pv').textContent = pvToSan(lastPv[1]) || '–';
    const u = j.bestmove;
    game.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] });
    board.position(game.fen());
    if (!afterMove()) {
      st.className = '';
      st.textContent = game.in_check() ? 'check — your move' : 'your move';
    }
  } catch (e) {
    st.className = ''; st.textContent = 'engine error: ' + e.message;
  }
  thinking = false;
}

function newGame(color) {
  myColor = color;
  game.reset(); board.orientation(color === 'w' ? 'white' : 'black'); board.start();
  thinking = false;
  $id('status').className = ''; $id('status').textContent = 'your move';
  $id('moves').innerHTML = '&nbsp;'; $id('tel').innerHTML = '';
  ['s-depth', 's-eval', 's-nps'].forEach(i => $id(i).textContent = '–');
  setEvalBar(0);
  document.querySelectorAll('.sq-last').forEach(e => e.classList.remove('sq-last'));
  if (color === 'b') engineMove();
}
fetch('/api/meta').then(r => r.json()).then(j => {
  const name = (j.engine || []).find(s => s.startsWith('name '));
  if (name) {
    const [n, v] = name.slice(5).split(' ');
    document.querySelector('h1').innerHTML = `${n.toUpperCase()} <span class="v">${v || ''}</span>`;
  }
}).catch(() => {});

$id('new').onclick = () => newGame('w');
$id('flip').onclick = () => newGame('b');
$id('undo').onclick = () => {
  if (thinking) return;
  // take back engine reply + own move (or single ply if engine hasn't answered)
  if (game.history().length && game.turn() !== myColor) game.undo();
  else { game.undo(); game.undo(); }
  board.position(game.fen());
  afterMove();
  $id('status').className = ''; $id('status').textContent = 'your move';
  $id('pv').textContent = '–';
};
// Theme: follow the system until the reader overrides it, then remember that.
const savedTheme = localStorage.getItem('sable-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$id('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const current = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('sable-theme', next);
};

$id('pgn').onclick = async () => {
  await navigator.clipboard.writeText(game.pgn());
  const b = $id('pgn'); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'PGN', 900);
};

fetch('/gate_last.json').then(r => r.ok ? r.json() : null).then(g => {
  if (!g || g.elo == null) return;
  const tag = g.shipped ? 'shipped' : 'gate';
  $id('gate-hint').textContent = ` · ${tag} ${g.elo >= 0 ? '+' : ''}${g.elo.toFixed(1)} Elo`;
}).catch(() => {});

fetch('/api/status').then(r => r.ok ? r.json() : null).then(d => {
  if (!d) return;
  const sp = d.selfplay_lines != null ? `${(d.selfplay_lines/1e6).toFixed(2)}M sp` : '';
  const tree = d.git?.clean === false ? ' · dirty tree' : '';
  if (sp || tree) $id('lab-hint').textContent = ` · ${sp}${tree}`;
}).catch(() => {});
</script>
