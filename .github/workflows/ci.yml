name: CI

# The engine issues arm64 Darwin syscalls directly and uses NEON intrinsics, so
# it only builds on Apple silicon. GitHub's macos-14+ runners are arm64.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup component add clippy rustfmt
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Perft (classic positions)
        run: bash tests/perft_suite.sh

      - name: Bench is deterministic
        # The node count is a behaviour fingerprint: two runs that disagree mean
        # something in the search is reading uninitialised or time-dependent
        # state, which is exactly the kind of bug that hides until it matters.
        run: |
          a=$(printf 'bench 13\n' | ./target/release/sable | awk '/Total nodes/ {print $4}')
          b=$(printf 'bench 13\n' | ./target/release/sable | awk '/Total nodes/ {print $4}')
          # A trailing `quit` is how every scripted run ends. It used to be read
          # ahead by the search's stdin poll and abort the benchmark on its first
          # position, so the run reported 0 nodes and still looked like a result.
          c=$(printf 'bench 13\nquit\n' | ./target/release/sable | awk '/Total nodes/ {print $4}')
          echo "run 1: $a nodes"
          echo "run 2: $b nodes"
          echo "run 3 (trailing quit): $c nodes"
          test "$a" = "$b"
          test "$a" = "$c"
          test "$a" -gt 0

      - name: UCI handshake
        run: |
          out=$(printf 'uci\nisready\nsetoption name Move Overhead value 100\nposition startpos moves e2e4\ngo depth 6\nquit\n' | ./target/release/sable)
          echo "$out" | grep -q '^uciok$'
          echo "$out" | grep -q '^readyok$'
          echo "$out" | grep -qE '^bestmove [a-h][1-8][a-h][1-8]'

      - name: Bulk input survives the pipe
        # A regression test for a specific bug: the input buffer used to drop
        # everything it held whenever it filled, so feeding more lines than the
        # buffer silently lost most of them. Both bulk commands must return
        # exactly one record per line they were given.
        run: |
          printf 'datagen 3000 400 7\n' | ./target/release/sable > /tmp/shard.txt
          lines=$(wc -l < /tmp/shard.txt)
          echo "shard: $lines lines"
          test "$lines" -ge 3000
          { printf 'relabel 400\n'; cat /tmp/shard.txt; } | ./target/release/sable > /tmp/relabelled.txt
          back=$(wc -l < /tmp/relabelled.txt)
          echo "relabelled: $back lines"
          test "$back" = "$lines"
          cut -d'|' -f1 /tmp/shard.txt | sed 's/ *$//' > /tmp/fens.txt
          { printf 'featdump\n'; cat /tmp/fens.txt; } | ./target/release/sable > /tmp/feat.bin
          python3 - <<'EOF'
          import struct
          raw = open('/tmp/feat.bin','rb').read()
          assert raw[:4] == b'SBF2', raw[:4]
          n_in, max_f = struct.unpack('<HH', raw[4:8])
          # A record is n, then n indices for each of the two perspectives, then
          # the bucket: 4n + 4 bytes. Striding by 2n + 4 lands mid-record, reads
          # a feature index as if it were a length, and skips an arbitrary
          # distance -- which is why this step reported 409 records for 3003
          # positions and failed every build since it was written. The engine was
          # right the whole time.
          pos, records, total = 8, 0, 0
          while pos < len(raw):
              n = struct.unpack_from('<H', raw, pos)[0]
              pos += 4 * n + 4
              records += 1
              total += n
          want = sum(1 for _ in open('/tmp/fens.txt'))
          print(f'featdump: {records} records for {want} positions, {total/records:.1f} features each')
          # Landing exactly on the end is the real check: it says every length
          # field in the file agrees with every other, not merely that the count
          # came out right.
          assert pos == len(raw), (pos, len(raw))
          assert records == want, (records, want)
          assert 0 < total / records <= max_f
          EOF

      - name: Binary size budget
        # The whole point of the project is that it stays small. 512 KB is
        # generous against the current ~265 KB; blowing through it means
        # something large landed in the image instead of BSS.
        run: |
          size=$(stat -f%z target/release/sable)
          echo "binary: $size bytes"
          test "$size" -lt 524288

  oracle:
    # The python-chess cross-check is slower and independent of the Rust build,
    # so it runs as its own job rather than holding up the fast feedback.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        # mlx too: verify_net.py imports the trainer's reference implementation
        # on purpose, so the check proves engine and trainer agree rather than
        # engine and some third copy of the maths.
        run: pip install chess numpy mlx
      - name: Build
        run: cargo build --release
      - name: Perft against python-chess
        run: |
          python tests/perft_oracle.py | tee /tmp/oracle.txt
          grep -q "failures: 0" /tmp/oracle.txt
      - name: Randomised perft
        run: |
          python tests/perft_fuzz.py | tee /tmp/fuzz.txt
          grep -q "0 mismatches" /tmp/fuzz.txt
      - name: Network inference matches the NumPy reference
        run: |
          python tests/verify_net.py | tee /tmp/net.txt
          grep -q "0 mismatches" /tmp/net.txt
