[package]
name = "sable"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "sable"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug-assertions = false

# Size-first profile. Same engine, smaller binary.
[profile.tiny]
inherits = "release"
opt-level = "z"
