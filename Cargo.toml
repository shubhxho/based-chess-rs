[package]
name = "sable"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "sable"
path = "src/main.rs"

# The binary is `no_std`, so it cannot unwind. Cargo ignores this setting for
# the test profile, where the harness does need unwinding, so `cargo test` is
# unaffected — this only stops a plain `cargo clippy` from failing to build.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug-assertions = false

# Size-first profile. Same engine, smaller binary.
[profile.tiny]
inherits = "release"
opt-level = "z"
